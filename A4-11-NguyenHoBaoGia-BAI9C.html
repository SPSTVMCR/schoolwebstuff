<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>A4-11-NGUYỄN HỒ BẢO GIA - BÀI 9C</title>
    <link rel='stylesheet' href='main.css'>
</head>
<style>
    body {
        text-align: center;
        font-family: Segoe UI, Tahoma, sans-serif;
        font-size: 20px;
        
    }
    .table1 {
        width: 100%;
        height: 500px;
        border-collapse: collapse;
        background: linear-gradient(to bottom, #f0f8ff, #e6f7ff, #cceeff, #b3e6ff, #99ddff);
    }
    .title {
        font-size: 30px;
        font-weight: bold;
        color: blue;
        padding: 10px;
        margin-bottom: 10px;
    }
    .header {
        background-color: lightblue;
        font-weight: bold;
        font-size: 23px;
    }
    .day {
        background-color: lightgray;
    }
    .available {
        background-color: lightgreen;
        text-align: center;
    }
    .subj-large {
        height: 100px;
    }
    .subj-large td {
        vertical-align: center;
    }
    .subj-large br {
        margin-bottom: 5px;
    }
    @keyframes animation {
        0% { background-color: lightgreen; }
        50% { background-color: rgb(47, 233, 47); }
        100% { background-color: lightgreen; }
    }
    .available {
        animation: animation 2s infinite;
    }
</style>
<body>
    <table border='1' class="table1">
        <caption class = "title">LỊCH HOẠT ĐỘNG CỦA CLB THỂ THAO</caption>
        <tr class="header">
            <th rowspan="2">Bộ môn</th>
            <th rowspan="2">Giáo viên phụ trách</th>
            <th colspan="6">Ngày</th>
        </tr>
        <tr class="day">
            <td>Thứ 2</td>
            <td>Thứ 3</td>
            <td>Thứ 4</td>
            <td>Thứ 5</td>
            <td>Thứ 6</td>
        </tr>
        <tr class="subj">
            <td>Bóng đá</td>
            <td>Thầy Khải</td>
            <td></td>
            <td class="available">X</td>
            <td></td>
            <td></td>
            <td class="available">X</td>
        </tr>
        <tr class="subj">
            <td>Bóng rổ</td>
            <td>Thầy Vũ</td>
            <td></td>
            <td></td>
            <td class="available">X</td>
            <td></td>
            <td></td>
        </tr>
        <tr class="subj-large">
            <td>Võ thuật</td>
            <td>
                Thầy Hoàng - Karatedo <br>
                Thầy Đức - Taekwondo <br>
                Thầy Thắng - Vovinam
            </td>
            <td class="available">X</td>
            <td class="available">X</td>
            <td></td>
            <td class="available">X</td>
            <td></td>
        </tr>
        <tr class="subj">
            <td>Bơi</td>
            <td>Cô Bích</td>
            <td></td>
            <td></td>
            <td class="available">X</td>
            <td></td>
            <td class="available">X</td>
        </tr>
    </table>
</body>
</html>
